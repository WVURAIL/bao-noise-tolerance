name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[test]"
      - run: python -m pip check
      - run: python -m pytest -q

  wheel-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip wheel --no-deps --wheel-dir dist .
      - name: Test the installed wheel outside the checkout
        run: |
          wheel_path=$(find "$GITHUB_WORKSPACE/dist" -name 'baonoise-*.whl' -print -quit)
          python -m venv /tmp/baonoise-wheel-smoke
          /tmp/baonoise-wheel-smoke/bin/python -m pip install "$wheel_path"
          cd /tmp
          /tmp/baonoise-wheel-smoke/bin/python -c "import baonoise; assert baonoise.__version__ == '1.0.0'"
          /tmp/baonoise-wheel-smoke/bin/python -m pip check
          /tmp/baonoise-wheel-smoke/bin/baonoise-forecast --cosmology planck2018 --uniform 0.0 --band dtv
          /tmp/baonoise-wheel-smoke/bin/baonoise-forecast --cosmology pact2025 --uniform 0.0 --band chime
          /tmp/baonoise-wheel-smoke/bin/baonoise-build-bank --help
          /tmp/baonoise-wheel-smoke/bin/python -c "from baonoise.fisherbank import BANK_SCHEMA_VERSION, FisherBank; from baonoise.resources import BANK_NAMES, RADIOFISHER_FILESYSTEM_NAMES, bank_file, filesystem_data_file; assert set(BANK_NAMES) == {'planck2018', 'pact2025'}; assert all(FisherBank(bank_file(name)).schema_version == BANK_SCHEMA_VERSION for name in BANK_NAMES); assert all(filesystem_data_file(name).is_file() for name in RADIOFISHER_FILESYSTEM_NAMES)"
