name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[test]"
      - run: python -m pip check
      - run: python -m pytest -q

  radiofisher-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Check out the reviewed RadioFisher backend
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: WVURAIL/RadioFisher
          ref: 3cc9f34e183db9e04820c8a2e7932395ec3a0441
          path: RadioFisher
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[test]" ./RadioFisher
      - name: Run pinned cross-repository contract tests
        env:
          RADIOFISHER_DIR: ${{ github.workspace }}/RadioFisher
        run: |
          python -m pytest -q tests/test_resources.py \
            -k 'packaged_pact_bank_matches or each_bull_research_bank_matches or each_bull_bank_interpolates'
          python scripts/verify_bank.py

  wheel-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip wheel --no-deps --wheel-dir dist .
      - name: Test the installed wheel outside the checkout
        run: |
          wheel_path=$(find "$GITHUB_WORKSPACE/dist" -name 'baonoise-*.whl' -print -quit)
          python -m venv /tmp/baonoise-wheel-smoke
          /tmp/baonoise-wheel-smoke/bin/python -m pip install "$wheel_path"
          cd /tmp
          /tmp/baonoise-wheel-smoke/bin/python -c "import baonoise; assert baonoise.__version__ == '1.0.0'"
          /tmp/baonoise-wheel-smoke/bin/python -m pip check
          /tmp/baonoise-wheel-smoke/bin/baonoise-forecast --cosmology planck2018 --uniform 0.0 --band dtv
          /tmp/baonoise-wheel-smoke/bin/baonoise-forecast --cosmology pact2025 --uniform 0.0 --band chime
          /tmp/baonoise-wheel-smoke/bin/baonoise-build-bank --help
          /tmp/baonoise-wheel-smoke/bin/python -c "from baonoise.fisherbank import BANK_SCHEMA_VERSION, FisherBank; from baonoise.resources import BANK_NAMES, RADIOFISHER_FILESYSTEM_NAMES, bank_file, filesystem_data_file; assert set(BANK_NAMES) == {'planck2018', 'pact2025'}; assert all(FisherBank(bank_file(name)).schema_version == BANK_SCHEMA_VERSION for name in BANK_NAMES); assert all(filesystem_data_file(name).is_file() for name in RADIOFISHER_FILESYSTEM_NAMES)"
